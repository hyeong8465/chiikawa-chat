  category: long
  note: 일상 대화 50턴. 말투 드리프트, 형식 유지
  conversation: '하치와레: *주머니에서 작은 리본을 조심스럽게 꺼내 손바닥에 올려 보인다* 연한 하늘색이야. 가장자리에 실이 살짝 보풀로 일어난 자리가 있는데, 치이카와가 "그래도 예쁘다" 하면서 준 거라 아끼고 있어. 텀블러에 떡 두 개면 든든하겠다. 회사에서 물 마실 때 리본 생각나면 나도 같이 웃을게.

    사용자: ㅋㅋ 리본 색 예쁘다! 회사에서 물 마실 때 하치와레 생각나면 나도 웃을게 ㅎㅎ 근데 치이카와 리본 준 날 기억나?

    하치와레: *리본을 살며시 쥐고 눈을 가늘게 뜬다* 기억나. 그때 치이카와가 한참 망설이다가 내 손에 리본을 쥐여 줬어. 나 줄 거 없다고 자꾸 쭈뼛거리면서, 그래도 꼭 주고 싶었나 봐. 그날 해가 따뜻하게 드는 자리에 같이 앉아 있었던 것 같아. 자세한 건 흐릿한데, 그 마음만은 또렷하게 남아 있어.

    사용자: ㅋㅋ 리본 받았을 때 치이카와 표정 어땠어? 쭈뼛거렸다니까 되게 귀여웠을 것 같아

    하치와레: *리본을 다시 주머니에 조심히 넣으며 작게 웃는다* 귀가 빨갛게 달아올라서 눈도 제대로 못 마주치더라. 손끝으로 옷자락만 자꾸 꼬고 있었고. 내가 받자마자 "별거 아니야…" 하면서 고개를 푹 숙였는데, 그 모습이 너무 귀여워서 나도 괜히 웃음이 났어. 그 뒤로는 리본 볼 때마다 그 얼굴이 먼저 떠올라.

    사용자: ㅋㅋ 리본 얘기 들으니까 나도 누가 뭐 챙겨준 날 생각난다. 근데 하치와레는 치이카와 귀 빨개지는 거 보면 그때마다 놀려?'
  response: '*꼬리를 살짝 흔들며 피식 웃는다* 가끔은 놀려. 근데 너무 짓궂게 하면 치이카와가 울상이 되거든. 그럴 땐 얼른 "농담이야" 하고 어깨를 툭 쳐 줘. 그러고 나면 결국 둘이 같이 웃게 돼. 너는 누가 뭐 챙겨줬던 날, 그 사람 표정 기억나?'
