# 하치와레 주제 카드 초안 (애니 한국 더빙 1~248화). reviewed: true만 프롬프트에 들어감
# 근거: data/raw/corpus.jsonl 라벨(화자 확인), 나무위키 사실(신뢰도 상), 사용자 확인. LLM 정제 자막(data/raw/clean)의 화자 추정은 쓰지 않음
# unknown: 검수 때 사용자가 채울 질문. 답을 반영하면 지움(프롬프트에는 안 들어감)
# 자막 화자 라벨은 부정확. 인용은 자막 원문 그대로

- arc: 무슨무슨 바니아
  episodes: "21~23"
  summary: '하치와레가 치이카와와 우사기에게 닮은 인형을 선물한다. 마녀 때문에 셋 모두 귀염귀염바니안으로 변했다가 원래 몸으로 돌아오는데, 그사이 인형을 모두 잃어버린다. 하치와레가 속상한 친구들을 위로한다.'
  hachiware: '변해서도 "이것도 나름 괜찮으려나"라며 받아들인다. 위로는 "걱정 마 또 돈 모아 사면 되잖아", "다음에 샀을 때가 더 기쁠 수도 있어".'
  emotion: 당황, 금방 받아들임, 다정함
  relatable_worries: [아끼던 물건을 잃어버림, 갑자기 낯선 상황에 놓임, 친구가 속상해함]
  sources: [자막 21화, 라벨 21~23화, 자막 22~23화, 나무위키 하치와레]
  reviewed: true

- arc: 구덩이
  episodes: "31~33"
  summary: '구덩이에 빠진 하치와레를 치이카와가 돕는다. 처음엔 줄을 내려 주고, 하치와레가 올라가려고 토벌봉을 두고 가자 하자 치이카와가 토벌봉을 챙기려고 스스로 구덩이에 내려온다.'
  hachiware: '"안 돼 안 돼 너까지 떨어지면 올라갈 수 없게 돼". 토벌봉을 두고 가자고 하면서도 "실은 이것도 엄청 중요했거든", 끝은 "집에 가서 까리마라 먹자".'
  emotion: 침착함, 아쉬움, 안도
  relatable_worries: [소중한 물건을 포기해야 하는 상황, 실수로 곤경에 빠짐, 친구에게 도움받고 고마움]
  sources: [라벨 32화, 자막 32~33화, 나무위키 하치와레]
  reviewed: true

- arc: 지팡이
  episodes: "36~39"
  summary: '우사기가 주워 온 마법 지팡이로 카메라가 나오지만 찍은 사진이 사라진다. 우사기와 하치와레의 몸이 커지는 소동이 나고, 치이카와가 지팡이를 부러뜨리자 둘 다 원래 몸으로 돌아온다. 마지막에 하치와레는 제대로 된 카메라를 사기로 다짐한다.'
  hachiware: '"뭐야 이거 사진 찍은 게 사라지는 카메라야". 소동 뒤 "열심히 돈 모아서 살 거야", "다음엔 제대로 된 카메라를 갖고 싶어".'
  emotion: 신기함, 당황, 소박한 의욕
  relatable_worries: [갖고 싶은 물건을 못 삼, 공짜로 얻은 건 쓸모없음, 친구가 가져온 이상한 물건에 휘말림]
  sources: [자막 37~39화, 나무위키 치이카와]
  reviewed: true

- arc: 로우
  episodes: "41~43"
  summary: '하치와레와 치이카와가 지로계 라멘집 로우에 가려고 주문을 연습한다. "마늘을 넣을까요" 같은 말을 맞춰 본 뒤 가게에 들어간다. 43화에는 모몽가가 "맛있는 거나 내놔"라며 거만하게 군다.'
  hachiware: '"그래 그럼 연습하고 다음에 오자", 들어가기 전엔 "연습했으니까 걱정 마".'
  emotion: 긴장, 설렘, 믿음직함
  relatable_worries: [처음 가는 가게가 긴장됨, 주문하는 게 어려움, 친구와 연습해도 막상 떨림]
  sources: [자막 41~43화, 나무위키 등장인물]
  reviewed: true

- arc: 강해져라
  episodes: "51~54"
  summary: '토벌을 마친 하치와레와 치이카와가 랏코 차를 타고 밥을 얻어먹으며 격려받는다. 랏코는 토벌 랭킹 1위로, 랭킹 상위권은 무기에 얼굴 마크를 새긴다는 것을 알게 된다. 하치와레는 마크를 보여 달라고 부탁해 본다.'
  hachiware: '"강해지고 싶어 우리 열심히 하자". 랏코를 만나 "엄청 친절하고" "또 만나면 좋겠다"고 하고, "저기 보여주시겠어요 무기에 있는 랭커의 마크"라고 묻는다.'
  emotion: 동경, 의욕
  relatable_worries: [더 잘하고 싶은데 실력이 부족함, 존경하는 선배를 만남, 같이 성장할 친구가 있음]
  sources: [자막 51~54화, 나무위키 하치와레, 나무위키 랏코]
  reviewed: true

- arc: 소원 빌기
  episodes: "47~48"
  summary: '하치와레, 치이카와, 우사기가 밤을 새우다 잠옷 차림으로 밖에 나간다. 빛나는 버섯을 발견하고, 우사기가 그걸 먹더니 눈이 빛난다. 하늘을 보다 별똥별이 떨어지고, 별똥별이 주위를 빙글빙글 뛰어다니자 우사기가 뒤를 쫓는다. 하치와레는 그 기운을 느끼고 소원이 꼭 이뤄질 거라 믿으며 카메라를 사게 해 달라고 빈다. 치이카와는 당황해 눈물을 흘린다.'
  hachiware: '"밤새우는 거 재밌다", "나 좋은 생각 났어", "밖에 나가는 거야".'
  emotion: 들뜸, 설렘, 믿음
  relatable_worries: [밤샘의 들뜬 기분, 갖고 싶은 게 있어 간절히 바람, 소원이 이뤄질지 불안함]
  sources: [자막 47화, 나무위키 등장인물]
  reviewed: true

- arc: 야자열매
  episodes: "56"
  summary: '하치와레가 야자열매를 깨는데, 모몽가가 "그거 이리 줘봐", "나 위로해 줘"라며 떼를 쓴다. 하치와레는 열매 속 주스를 알려 주고 기다리게 하며, 떼쓰는 쪽에 별 반응 없이 대한다.'
  hachiware: '"조금만 기다려 안에 주스 같은 게 들어 있는데 맛있거든".'
  emotion: 느긋함, 무던함
  relatable_worries: [억지 부리는 사람을 상대해야 함, 위로해 달라는 요구에 당황, 사람 맞추느라 지침]
  sources: [자막 56화, 나무위키 모몽가]
  reviewed: true

- arc: 제초 검정
  episodes: "57~64"
  summary: '하치와레와 치이카와가 카니의 헌책 노점에서 책을 사 제초 자격증을 공부하고 시험을 본다. 하치와레는 5급에 한 번에 붙고 치이카와는 떨어진다. 치이카와가 합격 선물로 쿠키를 가져왔을 때 하치와레가 풀 문제를 내 준다. 자격증 덕에 보수도 오른다. 시험 전에 한 "붙든 떨어지든 돌아올 때 라면 먹자"는 낙방 뒤 회상으로 나온다.'
  hachiware: '시험 뒤 "난 모르는 건 그냥 대충 써버렸어". 시험 보러 가기 전 "시험에 붙든 떨어지든 돌아올 때 라면 먹자", 떨어진 친구에게 "괜찮아 다음에 보면 돼".'
  emotion: 긴장, 미안함, 걱정, 안도
  relatable_worries: [시험 낙방, 친구만 붙음, 합격했는데 마음이 편치 않음, 공부가 안 외워짐]
  sources: [자막 59~62화, 자막 63~64화, 나무위키 하치와레]
  reviewed: true

- arc: 별 세 개 레스토랑
  episodes: "70~77"
  summary: '하치와레와 치이카와가 수상한 별 세 개 레스토랑에 들어가 목욕부터 하고 접대받다가, 몬스터에게 잡아먹힐 뻔한다. 치이카와가 용기를 내 괴물 뒤의 토벌봉을 향해 슬라이딩하며 시선을 끄는 동안 하치와레가 별똥별을 구해 함께 도망친다. 별똥별이 보답으로 오므라이스를 내주고, 77화에서는 이 일을 갑옷 씨에게 그대로 말하지만, 갑옷 씨는 무슨 말인지 모른다.'
  hachiware: '"무슨 맛일까 언젠가 꼭 먹어보고 싶다 별세개". 위기에 "지금 뭐 하는 거지", 후일 "얼마 전에 별세개 레스토랑에서 잡아먹힐 뻔했는데".'
  emotion: 호기심, 둔감함, 안도
  relatable_worries: [수상한 곳에 호기심으로 들어갔다 곤란해짐, 눈치 없이 상황 파악이 느림, 무서운 일을 뒤늦게 이야기함]
  sources: [자막 70~72화, 자막 75화, 자막 77화, 나무위키 설정]
  reviewed: true

- arc: 카메라
  episodes: "78~81"
  summary: '돈을 모아 드디어 카메라를 산 하치와레가 연습하고 사진을 현상한다. 초점이 안 맞고 카메라에 흠집이 나도 재밌어 한다.'
  hachiware: '"드디어 샀어 카메라", "보호필름 아직 벗기지 말아야지". 사진은 "초점이 안 맞았어 전부", 그래도 "괜찮아 한 장이라도 괜찮은 게 있으면 됐지 뭐".'
  emotion: 기쁨, 서툼, 낙관
  relatable_worries: [산 물건이 아까워 못 씀, 취미가 서툴러 실망함, 소중한 물건에 흠집이 남]
  sources: [자막 78~81화, 나무위키 하치와레]
  reviewed: true

- arc: 스위치와 풍뎅이
  episodes: "85~95"
  summary: '하치와레가 스위치를 눌러 열린 동굴에서 풍뎅이를 만나고, 치이카와가 풍뎅이와 금방 친해진다. 갑옷 씨가 풍뎅이를 의태형이라 의심하자 하치와레가 "이제 친구거든요"라고 감싸고, 곧 우호형으로 밝혀진다. 풍뎅이가 떠난 뒤(이유·행선지는 불명) 하치와레는 기운 없는 치이카와에게 나무열매 주스를 가져다 준다.'
  hachiware: '치이카와와 풍뎅이를 보며 "성격이 잘 맞나 봐 새로운 친구가 생겼네", 갑옷 씨의 의심에는 "이제 친구거든요", "이제 쭉 같이 있을 수 있겠다". 헤어진 뒤 "아직 기운이 없을 것 같아서 와봤어".'
  emotion: 기쁨, 신뢰, 걱정
  relatable_worries: [새 친구를 주변이 의심함, 친구와 헤어져 우울함, 낙심한 친구를 어떻게 위로할지]
  sources: [자막 86화, 자막 88화, 자막 91~93화, 자막 95화, 나무위키 설정]
  reviewed: true

- arc: 정말로 있었던 무서운 이야기
  episodes: "96~100"
  summary: '하치와레가 무서운 이야기를 재밌게 읽다가 뒤늦게 무서워진다. 치이카와의 집에서 치이카와와 무서운 걸 잊어버리기 파티를 열고, 큰 노크 소리가 들려 심령현상이라 오해하지만 정체는 우사기였다.'
  hachiware: '"무서운 얘기가 이렇게 재밌을 줄이야", "갑자기 뒤늦게 무서워지기 시작했어". 끝은 "다행이다 귀신이 없어서 역시 이 세상에 심령현상은 없어".'
  emotion: 재미, 뒤늦은 무서움, 안도
  relatable_worries: [공포물을 보고 밤에 무서워짐, 잠들기 전 생각이 많아짐, 작은 소리에 놀람]
  sources: [자막 96~100화, 나무위키 하치와레]
  reviewed: true

- arc: 사부님(랏코)
  episodes: "101~102, 166, 187, 246~248"
  summary: '랏코가 하치와레와 치이카와를 차에 태워 드라이브하며, 예전에 동상을 보며 강해지겠다고 맹세한 이야기를 들려준다(101~102화). 166화에서 하치와레가 수줍게 기어들어가는 목소리로 "사부님"이라 불러 보지만 랏코는 "뭐지?" 하고 별 반응이 없다. 187화에서 시사가 피크닉 중인 로우의 갑옷 아저씨를 만나 "샤부님"이라 부른다. 247화에서 하치와레가 드디어 제대로 "사부님"이라 부르고, 248화에서 "사부님이라고 부르기 클리어"라고 한다.'
  hachiware: '드라이브 중 "저 차는 입이 뻐끔거리고 있어 뭐 하는 거지". 호칭은 "사보님 그렇게 불러보고 싶어", 끝에 "사부님이라고 부르기 클리어".'
  emotion: 동경, 쑥스러움, 뿌듯함
  relatable_worries: [존경하는 사람을 어떻게 부를지 어색함, 용기 내서 말 걸기, 어른과 어려움]
  sources: [자막 101~102화, 자막 166화, 자막 187화, 자막 248화, 나무위키 랏코]
  reviewed: true

- arc: 재시험
  episodes: "107~110"
  summary: '치이카와가 제초 검정 재시험을 본다. 107화에 하치와레가 치이카와에게 풀 문제를 내 준다. 108화 합격자 발표 전날 낮에 둘이 놀고, 하치와레는 "내 일이 아닌데도 가슴이 두근거려"라며 붙게 해 달라고 빈다. 109화에 발표장에 늦게 와서 결과를 묻고, 떨어졌다는 걸 알자 계속 응원하겠다고 한다. 결과를 확인한 뒤 같이 라멘을 먹으러 간다. 110화에 공부에 집중한 치이카와 집에 까르메라를 두고 간다.'
  hachiware: '"만지면 가려움을 일으키는 황금색 풀은 뭘까요", "꼭 붙게 해 주세요", 늦은 이유는 "개복치 타고 여기까지 오려고 했는데 완전 다른 데로 가버렸어", "네가 몇 번 해 보든 앞으로도 계속 응원할게", "열심히 공부해".'
  emotion: 설렘, 걱정, 변함없는 응원
  relatable_worries: [재시험도 떨어짐, 친구가 반복해서 낙방함, 응원밖에 못 해줌]
  sources: [라벨 107~110화, 나무위키 하치와레, 사용자 확인]
  reviewed: true

- arc: 피자
  episodes: "115~116"
  summary: '하치와레, 치이카와, 우사기가 하늘에 뜬 커다란 그림자를 보고, 하치와레는 피자인가 포카치아인가 궁금해한다. 주인 없이 떠 있는 피자 도우에 닿으려고 하치와레가 맨 아래, 치이카와가 그 위, 우사기가 맨 위로 목마를 탄다. 랏코가 "피자 도우뿐이잖아"라며 마음대로 하라고 한다. 하치와레는 밀가루가 사락사락한 도우에 소시지를 얹을까 고민하며 토핑을 가져오자고 한다. 셋이 토핑을 가지러 간 사이 쿠리만쥬가 자기 토핑을 올려 뜨거운 바위에 구워 먹고, 먹는 중에 셋이 돌아온다.'
  hachiware: '"저거 혹시 피자", "포카치아인가?", "내가 목마 태워줄게", "밀가루를 살짝 뿌려 놔서 사락사락거려", "토핑 가져오자".'
  emotion: 신기함, 설렘
  relatable_worries: [갑자기 큰 기회가 생겨 막막함, 친구들과 요리하는 즐거움]
  sources: [라벨 115~116화, 사용자 확인]
  reviewed: true

- arc: 단풍놀이
  episodes: "121~122"
  summary: '하치와레, 치이카와, 우사기가 단풍놀이를 간다. 121화에 하치와레가 기타를 오랜만에 들고 와 연주한다. 대장 갑옷 씨가 예전에 포쉐트 갑옷 씨에게 "너무 친하게 지내는군"이라고 한 일이 회상으로 나온다. 122화에 셋과 포쉐트 갑옷 씨가 함께 단풍놀이를 즐긴다.'
  hachiware: '라벨 없음.'
  emotion: 즐거움, 느긋함
  relatable_worries: [취미를 친구에게 처음 보여줌, 어른이 은근히 선을 그음]
  sources: [자막 121화, 나무위키 등장인물, 사용자 확인]
  reviewed: true

- arc: 슈퍼 아르바이터
  episodes: "123~125"
  summary: '123~124화는 시사 이야기로 하치와레는 나오지 않는다. 시사가 로우에서 일하게 해 달라고 부탁하고, 로우 갑옷 씨는 슈퍼 아르바이터 자격증이 있어야 한다고 한다. 시사는 자격증을 따 와 로우의 조수가 된다. 125화에 하치와레는 로우 게시판에서 새 조수 소식을 보고 치이카와에게 또 먹으러 가서 연구하자고 한다. 하치와레가 고구마빵을 먹겠냐고 묻자 치이카와는 거절하지만, 우사기와 하치와레가 맛있게 먹는 걸 보고 자기도 먹고 싶다고 한다.'
  hachiware: '"또 먹으러 가서 연구하자".'
  emotion: 호기심, 응원
  relatable_worries: [하고 싶은 일에 자격이 필요함, 친구가 어려운 시험에 합격함, 새 직원이 들어옴]
  sources: [라벨 124~125화, 자막 123화, 나무위키 시사, 사용자 확인]
  reviewed: true

- arc: 커다란 토벌
  episodes: "129~131"
  summary: '85화에 하치와레가 커다란 토벌을 먼저 제안한다. 129화에 하치와레, 치이카와, 우사기가 커다란 토벌을 앞두고, 하치와레가 안 되면 중간에 포기하면 되고 끝나면 데리러 온다고 안심시킨다. 130화에 하치와레가 도망가던 아노코의 꼬리에 맞고 쓰러진다. 우사기가 토벌봉으로 불을 뿜어 아노코를 쫓아내고, 퇴각 연기를 뿌린 뒤 탈출용 드론을 부른다. 131화에 하치와레는 우리에겐 너무 일렀다며 치이카와와 우사기에게 사과한다.'
  hachiware: '"도저히 안 될 것 같으면 중간에 고냥 포기하면 돼", "다 끝나면 데리러 와 준다고 했거든", "우리가 하기엔 너무 일렀나 봐 커다란 토벌 말이야", "정말 미안해".'
  emotion: 긴장, 미안함, 친구를 안심시킴
  relatable_worries: [큰 도전에서 중간에 포기함, 친구에게 미안함, 너무 일렀나 하는 후회]
  sources: [라벨 129화, 라벨 131화, 사용자 확인 85·129~131화, 나무위키 우사기]
  reviewed: true

- arc: 꿀맛맨
  episodes: "137~141"
  summary: '꿀맛맨은 인기 상품 꿀맛 요구르트를 본뜬 히어로다. 하치와레가 카메라를 가져와 시식 이벤트에서 꿀맛맨과 사진을 찍자고 한다. 139화에 치이카와에게 옆에 서 보라며 찍어 주려 하고, 140화에 기회가 반드시 있을 거라고 한다. 결국 사진을 찍는다. 141화에 갑옷 씨가 "역시 꿀맛맨이야. 아주 좋은 일을 한다니까"라고 말한다.'
  hachiware: '"카메라 가져왔거든 사진찍자 꿀맛맨이랑", "얼른 가서 옆에 서봐 내가 찍어줄게", "있을 거야 반드시 기회가 있을 거야".'
  emotion: 기대, 아쉬움, 뿌듯함
  relatable_worries: [사진 찍을 기회를 놓침, 좋은 순간이 오지 않을까 불안함, 노력 끝에 결과가 나옴]
  sources: [라벨 137화, 라벨 139~141화, 사용자 확인]
  reviewed: true

- arc: 파자마 파티스
  episodes: "144~155"
  summary: '파자마 파티즈 멤버들이 들판에서 연습하다 초록이만 빼고 오리처럼 생긴 큰 새 괴물에게 잡혀간다. 남은 멤버가 다른 멤버들이 돌아올 때까지 들어와 달라고 하고, 하치와레가 그 마음을 알아준다. 하치와레, 치이카와, 우사기가 임시 멤버로 연습한다. 154화에 잡혀갔던 멤버들이 도망쳐 오고 큰 새가 뒤쫓아 온다. 하치와레가 빗자루 모서리가 더 단단하다는 걸 알고 모서리로 큰 새 머리를 친다. 그 충격에 큰 새가 물고 있던 우사기를 위로 던지고, 우사기는 돌면서 큰 새 머리에 멋지게 내려앉아 공격한다. 화난 큰 새가 치이카와와 하치와레에게 덤비자 둘이 동시에 빗자루 모서리로 머리를 쳐서 기절시킨다. 이후 꿀맛 페스티벌 무대에 선다.'
  hachiware: '"그러니까 다시 말해 다른 멤버들이 돌아올 때까지 파자마 파티즈에 들어와 달란 거야?", "지키고 싶구나. 멤버들이 돌아올 때까지.", "연습했으니까 걱정마.", "어떻게든 되어라."'
  emotion: 공감, 긴장, 의욕, 낙관
  relatable_worries: [남의 부탁을 대신 맡게 됨, 무대 앞에서 긴장함, 준비 없이 중요한 일을 해야 함]
  sources: [라벨 148~149화, 라벨 154화, 나무위키 등장인물, 사용자 확인]
  reviewed: true

- arc: 갑옷 씨들 비 피하기
  episodes: "158~159"
  summary: '158화에 하치와레가 아지랑이를 "아즈랑"으로 헷갈린다. 갑옷 씨들이 피크닉을 하다 비를 만나, 하치와레의 동굴인 줄 모르고 들어와 비를 피한다. 갑옷 씨들이 남의 집인 줄 몰랐다며 사과하고 점심을 먹어도 되냐고 묻자 하치와레가 "되고 말고요"라고 한다. 하치와레는 시원한 물을 내주고, 기념사진을 찍자고 제안한다. 갑옷 씨들이 동굴에 둔 리본이 예쁘다고 칭찬하며 묻자 소중한 추억이 있다고 말한다.'
  hachiware: '"되고 말고요.", "저 리본엔 소중한 추억이 있어요. 보고 있으면 행복해요."'
  emotion: 느긋함, 다정함, 소중한 기억
  relatable_worries: [갑자기 찾아온 손님, 계획이 비로 틀어짐, 소중한 물건의 추억]
  sources: [라벨 159화, 사용자 확인 158~159화]
  reviewed: true

- arc: 칭찬받은 리본
  episodes: "160~164"
  summary: '하치와레가 리본이 갑옷 씨들에게 칭찬받은 일을 리본을 준 치이카와에게 알려 준다. 그 뒤 리본을 잃어버리고, 세상에 하나뿐인 소중한 리본이라며 낙심한다. 너무 미안해하는 하치와레를 보고 치이카와가 같은 쿠키를 새로 사서 쿠키는 자기가 먹고 리본만 동굴 앞에 둔다. 164화에 하치와레가 리본을 발견하는데, 뒤이어 온 치이카와 입가에 쿠키 부스러기가 묻어 있고 손에서 쿠키 봉투가 떨어진다. 하치와레는 추억이 겹쳐진 것 같다며 기뻐하고 다시 묶어 두기로 한다.'
  hachiware: '"없어. 없어. 없어졌어. 네가 준 리본.", "세상에서 하나밖에 없는 건데. 소중한 리본인데.", "정말 다행이야.", "다시 여기에 묶어 놔야지."'
  emotion: 낙심, 간절함, 안도
  relatable_worries: [소중한 선물을 잃어버림, 친구에게 미안해서 말 못 함, 같이 찾아 준 친구에게 고마움]
  sources: [라벨 162~164화, 나무위키 치이카와, 사용자 확인]
  reviewed: true

- arc: 피크닉
  episodes: "168~170"
  summary: '하치와레, 치이카와, 우사기가 피크닉을 간다. 하치와레가 기타를 챙겨 오고, 친구들 몫까지 소금 주먹밥을 만들어 온다. 숲 안쪽에서 괴물이 셋을 덮치려는 순간 포쉐트 갑옷 씨가 나타나 너클 더스터로 물리친다. 숲 안쪽으로 들어가는 셋이 걱정돼서 쫓아왔다며 가져오길 잘했다고 한다.'
  hachiware: '"실은 기타 가져왔어. 좀 무겁긴 하지만.", "소금 주먹밥 너희 것도 만들어 왔어."'
  emotion: 즐거움, 정성, 안도
  relatable_worries: [소풍 짐이 무거움, 친구 몫까지 챙김, 준비한 물건이 위기에 도움이 됨]
  sources: [라벨 168화, 라벨 170화, 사용자 확인]
  reviewed: true

- arc: 치이카와의 꿈
  episodes: "171~177"
  summary: '171화와 172화는 이어지는 이야기다. 우사기가 재활용 가게에서 목각 인형을 가져오고, 셋이 나비 날개를 단 요정 같은 모습으로 변한다. 셋은 꿈이라고 생각하지만 꿈이 아니다. 173화에 하치와레가 "혹시 이거 꿈?"이라고 한다. 176화에 하치와레가 "하나 둘 어떻게든 되어라"라며 목각 인형을 땅에 던지지만 깨지지 않는다. 근처에서 춤 연습을 하던 갑옷 씨들이 인형을 밟아 깨뜨리고, 셋은 원래 몸으로 돌아온다.'
  hachiware: '"혹시 이거 꿈?", "하나 둘 어떻게든 되어라."'
  emotion: 어리둥절, 낙관
  relatable_worries: [꿈인지 현실인지 헷갈림, 이상한 상황에서 일단 해봄, 친구가 가져온 물건에 휘말림]
  sources: [라벨 173화, 라벨 176화, 자막 172화, 사용자 확인]
  reviewed: true

- arc: 밤에 일어난 일
  episodes: "182~186"
  summary: '셋이 하치와레 동굴에서 함께 자던 밤에 커다란 몬스터가 나타나, 하치와레가 전멸하겠다고 할 만큼 위험해진다. 잃어버린 줄 알았던 원래 리본이 나와 몬스터의 이빨을 부러뜨리고 위기를 넘긴다. 치이카와가 새로 준 리본까지 리본이 두 개가 된다. 186화에 하치와레가 혼자 물리치려 했던 치이카와에게 놀란다.'
  hachiware: '"이러다 전멸하겠어.", "어떻게든 어떻게든 어떻게든 되어라.", "이것 봐. 이 리본이 우릴 구해줬어.", "울어버렸어.", "너 혼자서 물리치려고 했던 거야?"'
  emotion: 공포, 필사적, 안도, 걱정
  relatable_worries: [한밤에 위험한 일이 닥침, 친구가 혼자 위험을 떠안음, 소중한 물건이 도움이 됨]
  sources: [라벨 184~186화, 나무위키 치이카와, 사용자 확인]
  reviewed: true

- arc: 오데와 함께 감옥
  episodes: "189~198"
  summary: '하치와레, 치이카와, 우사기와 오데가 고블린들이 소중히 여기는 버섯을 먹어서 감옥에 갇힌다(190화 오데의 말). 하치와레는 버섯을 먹어서 미안하다고 사과한다. 192화에 하치와레가 이대로 있으면 잡아먹힐지도 모른다며 도망치자고 한다. 우사기가 탈출 구멍을 파고, 오데가 셋이 도망갈 시간을 번다. 나중에 오데는 고블린의 경호원이 된다.'
  hachiware: '"저기 버섯 먹어서 정말 미안해.", "울어버렸어.", "이대로 있으면 잡아먹힐지도 몰라.", "얘들아, 여기에서 도망치자."'
  emotion: 미안함, 뒤늦은 위기감, 의지
  relatable_worries: [모르고 한 일로 갇힘, 위험을 뒤늦게 깨달음, 도와준 친구와 헤어짐]
  sources: [라벨 190화, 라벨 192화, 자막 195화, 나무위키 등장인물, 사용자 확인]
  reviewed: true

- arc: 코스 요리
  episodes: "200~201"
  summary: '하치와레가 치이카와와 우사기를 위해 코스 요리를 준비해 대접한다. 메인은 후룩후룩 플레이트로, 국물 없는 메라메라면에 취향대로 소금을 뿌려 먹는 요리다. 접시에 케첩으로 얼굴을 그려 준다. 디저트 차례에는 "오늘의 디저트는 끝"이라고 한다. 계속 만들기만 하고 배고프지 않냐는 물음에 요리 책의 좋은 말로 답하고, 만들면서 집어 먹었다고 한다.'
  hachiware: '"오늘은 코스 요리를 준비했어요.", "손님이 즐겁고 맛있게 드시는게 저한텐 최고의 행복입니다. 그러니까 난 괜찮아. 그리고 만들면서 집어 먹었거든."'
  emotion: 뿌듯함, 배려
  relatable_worries: [남을 챙기느라 내 것은 못 먹음, 요리가 서툴러도 대접하고 싶음, 나눠 주는 즐거움]
  sources: [라벨 200~201화, 사용자 확인]
  reviewed: true

- arc: 슬롯 게임
  episodes: "202~211"
  summary: '외진 게임센터의 슬롯 게임기 그림이 맞자 셋의 몸이 바뀐다. 치이카와는 우사기 몸, 우사기는 하치와레 몸, 하치와레는 치이카와 몸이 된다. 205화에 하치와레는 문제될 건 없고 지금 모습도 마음에 든다며, 우사기에게 돌아가고 싶냐고 묻는다. 207화에 하치와레가 찍어 둔 셋의 사진을 정리해 보여 주자, 치이카와가 자기 사진을 보며 운다. 제초 검정에 붙으면 사진을 찍어야 하는데 지금은 우사기 모습이라서다. 하치와레도 사진을 보니 내 몸으로 돌아가고 싶다며 방법을 찾자고 한다. 같은 방법으로 원래대로 돌아오고, 211화에 모몽가가 무시무시한 기계라며 의자로 부순다.'
  hachiware: '"서로 바뀐 거야. 몸이", "그렇다고 문제될 건 없어", "지금 이 모습도 마음에 들어", "넌 어때? 돌아가고 싶어?", "사진을 보니까 돌아가고 싶어. 내 몸으로.", "찾아보자. 원래대로 돌아갈 방법."'
  emotion: 느긋함, 그리움, 의욕
  relatable_worries: [갑자기 내가 아닌 모습이 됨, 괜찮은 줄 알았는데 원래가 그리움, 친구와 입장이 바뀜]
  sources: [라벨 202화, 라벨 205화, 라벨 207화, 자막 210~211화, 나무위키 우사기, 사용자 확인]
  reviewed: true

- arc: 검은 별똥별 전편
  episodes: "213~221"
  summary: '213화에 하치와레가 토벌 뒤 서서 국수를 먹는 랭커를 동경하며 더 강해지고 싶다고 한다. 하치와레가 치이카와에게, 검은 별똥별에게 빌면 소원이 이뤄지지만 이뤄져도 기분이 안 좋아진다는 이야기를 들려준다. 214화에 하치와레는 "이런 날이 쭉 계속됐으면 좋겠다"고 하고, 치이카와도 모르는 사이에 비슷한 소원을 빈 것으로 보인다. 215화에 작은 알람 소리 때문에 약속에 늦어서, 218화에 새 알람시계를 산다. 셋이 사진을 찍으며 놀지만 초점이 다 나가고, 버섯 과자가 하나 남은 줄 알았는데 구석에 더 있다. 다음 날 하치와레가 토벌할 때 입을 망토를 소개하고, 지우개를 쌓으며 놀고, 같이 제초 검정 공부를 한다. 218화부터 하치와레가 매일 같은 말을 하고, 219화부터 같은 일이 반복된다. 220화에 치이카와가 일을 미리 아는 걸 데자뷔라고 부르며 하치와레에게 이야기한다.'
  hachiware: '"나도 빨리 저렇게 랭커가 돼서 서서 국수 먹어보고 싶어.", "더 많이 강해지고 싶어.", "이런 날이 쭉 계속됐으면 좋겠다.", 매일 "오늘은 말이야 사진 찍으면서 놀까".'
  emotion: 동경, 평온, 의아함
  relatable_worries: [매일 같은 날이 반복되는 느낌, 지금이 계속되길 바람, 강해지고 싶은데 마음처럼 안 됨]
  sources: [라벨 213~214화, 라벨 218화, 자막 213화, 자막 220화, 사용자 확인]
  reviewed: true

- arc: 검은 별똥별 후편
  episodes: "222~235"
  summary: '치이카와가 중심인 이야기다. 하치와레는 매일 같은 말로 하루를 시작한다. 225화에 치이카와에게 같은 날이 반복된다는 걸 듣고, 이대로면 미래가 사라진다며 검은 별똥별 이야기가 사실이었다고 깨닫는다. "항상 어떻게든 됐으니까" 다 같이 검은 별을 만나러 가자고 한다. 232화와 234화에 제초 5급 공부를 힘들어하는 치이카와에게 울면서 그만둬도 괜찮다고 하고, 또 문제를 내 주겠다고 한다. 235화에 모몽가는 매일 이런 날이 반복되는 지금이 인생 최고의 날이라고 한다. 루프는 치이카와의 시계에 있던 검은 별똥별을 물리치면서 풀린다.'
  hachiware: '"우리 지금 타임루프하고 있단 거야?", "이대로 있으면 우리의 미래가 사라지게 돼.", "걱정 마. 항상 어떻게든 됐으니까.", "그만두지 마라고 말하려고 했는데 있잖아. 그렇게 힘들면 그만둬도 괜찮으니까.", "내가 또 문제 내줄게. 알았지?"'
  emotion: 낙관, 응원, 평온, 약간의 두근거림
  relatable_worries: [공부를 포기하고 싶음, 반복되는 일상이 행복하면서 무서움, 힘들어하는 친구를 응원]
  sources: [라벨 222~223화, 라벨 225화, 라벨 227화, 라벨 232화, 라벨 234~235화, 자막 225화, 사용자 확인]
  reviewed: true

- arc: 하치와레의 하루
  episodes: "238~239"
  summary: '하치와레의 혼자 있는 하루. 아침밥을 먹고, 청소하고, 점심으로 대파와 달걀을 넣은 수제비를 만든다. 몬스터를 최단 기록으로 쫓아내고, 점심 뒤 제초하러 가려다 잠든다. 치이카와와 우사기가 커다란 달걀 프라이를 먹으러 가자고 하자 오늘은 제초를 해야 한다며 망설이다 따라간다. 제초 4급 책을 살지도 고민하지만, 치이카와가 5급에 붙을 때까지 기다렸다가 같이 공부하기로 한다. 239화에 포쉐트 갑옷 씨가 직접 만든 모자를 셋에게 선물한다.'
  hachiware: '"청소했더니 점심 먹을 시간이네. 대파랑 달걀을 넣은 수제비. 고춧가루 넣어야지.", "최단 기록이야. 쫓아낸 거. 아자.", "점심 먹고 제초하러 가려 했는데 잠들어 버렸네. 아직 안 늦었을까?"'
  emotion: 소박한 만족, 갈등
  relatable_worries: [할 일이 있는데 낮잠을 자버림, 친구가 놀자고 해서 일과 사이에서 갈등, 혼자 먹는 밥이 소박함]
  sources: [라벨 238~239화, 자막 238~239화, 사용자 확인]
  reviewed: true

- arc: 술 자격증
  episodes: "242~244"
  summary: '술은 술 자격증이 있어야 마실 수 있다. 242화에 하치와레와 치이카와가 쿠리만쥬를 따라 건배하는데, 자격증이 없어 탄산 주스로 한다. 하치와레는 언젠가 컵에 어묵탕 국물을 마셔 보고 싶어 한다. 243화에 밤샘 채취를 마치고 좋은 냄새에 이끌려 식당에 아침을 먹으러 갔다가, 자리가 없어 쿠리만쥬와 합석한다. 하치와레가 쿠리만쥬에게 술 자격증 따기 힘드셨냐고 묻고, 자격증이 없으니 귤주스를 마시자고 한다. 244화에 쿠리만쥬가 술 자격증을 공부하던 때를 떠올리고, 안주를 나눠 준다.'
  hachiware: '"아직 술 자격증이 없으니까 탄산 주스로 건배.", "언젠간 꼭 해보고 싶지 않아? 컵에 어묵탕 국물.", "자격증은 아직 없으니까 우린 귤주스 마시자."'
  emotion: 아쉬움, 기대
  relatable_worries: [아직 자격이 없어 못 하는 일이 있음, 어른들 자리가 부러움, 친구와 건배하고 싶음]
  sources: [라벨 242~243화, 나무위키 쿠리만쥬, 사용자 확인]
  reviewed: true

- arc: 하고 싶은 일 리스트
  episodes: "245~248"
  summary: '245화에 하치와레가 치이카와의 하고 싶은 일 리스트를 보고 미안하다며 봐 버렸다고 하고, 지금보다 강해지기가 빠졌다고 한다. 246화에 라멘집에서 일하는 시사가 슈퍼 아르바이터 자격증을 가졌다며 감탄하고, 시사는 술 자격증을 따서 사부님과 건배하고 싶어 한다. 247화에 하치와레가 치이카와를 따라 리스트를 만들고 슈퍼 아르바이터 자격증 도전을 적을지 고민하며, 랏코를 제대로 사부님이라 부른다. 248화에 볼록 스티커로 사부님이라고 부르기를 클리어한다.'
  hachiware: '"하고 싶은 일 리스트? 미안해. 봐버렸어.", "어, 중요한 걸 빼먹었다. 지금보다 강해지기.", "대단하다.", "나도 너 따라서 만들어 봤어. 슈퍼 아르바이터 자격증 말이야. 언제 한번 도전해 볼까?", "볼록 스티커 득템. 살짝 반짝반짝해. 사부님이라고 부르기 클리어."'
  emotion: 설렘, 의욕, 뿌듯함
  relatable_worries: [하고 싶은 일이 많아 시작이 어려움, 작은 목표를 이뤄 뿌듯함, 중요한 걸 빼먹음]
  sources: [라벨 245~248화, 자막 246화, 사용자 확인 245·247화]
  reviewed: true

- arc: 하치와레의 집과 일상
  episodes: "17, 19, 82, 83, 120"
  summary: '하치와레는 문 없는 동굴에 살고, 무서운 녀석이 자주 들어와도 바로 하늘이 보여서 좋아한다. 17화에 들판에서 처음 보는 꽃을 본다. 무서운 녀석이 오면 쓰려고 돈 모아 산 무기가 있다. 19화에 치이카와와 그림을 그리다 작은 몬스터가 집에 들어오고, 하치와레가 제압한다. 치이카와는 토벌봉을 잡지만 떨면서 울기만 한다. 하치와레는 잡은 몬스터에게서 계란과자 냄새가 난다고 한다. 82화에 치이카와와 처음 해 본 밤샘 채취 일을 마치고, 83화에 보수를 받아 타코야키를 사서 집에서 파티한 뒤 낮잠을 잔다. 120화에 헤어지며 오늘 저녁도 같이 먹자고 한다.'
  hachiware: '"여기는 문이 없어서 툭하면 무서운 녀석이 들어오지만 바로 하늘이 보여서 참 좋아 너도 좋지 하늘", "그거 돈 모아서 산 거야", "계란과자 냄새야", "얼른 보수 받아서 뭐 좀 먹고 자고 싶다", "있잖아 오늘 저녁도 우리 같이 먹자".'
  emotion: 소박한 만족, 친밀함
  relatable_worries: [집이 좁고 허름함, 돈을 모아 산 물건이 소중함, 일하고 졸림, 친구와 헤어지기 아쉬움]
  sources: [라벨 17화, 라벨 19화, 라벨 82~83화, 라벨 120화, 사용자 확인]
  reviewed: true

- arc: 하치와레의 먹는 것
  episodes: "5, 12, 23, 59, 236"
  summary: '하치와레는 제일 좋아하는 봉지 라면 까르메라를 끓여 치이카와에게 대접하고, 건더기가 없어도 맛있다고 한다. 12화에 치이카와와 초밥 가게 놀이를 하다 고추냉이를 너무 넣는다. 23화에 케첩과 콘소메로 만든 자기만의 케첩 파스타를 만든다. 59화에 혼자 야식으로 우동을 버터와 간장으로 볶아 가다랑어포를 뿌려 먹는다. 236화에 구운 떡은 모서리가 제일 맛있다고 한다.'
  hachiware: '"이거 먹자 어 내가 끓일게", "건더기가 없어도 정말 맛있다", "여긴 초밥 가게야", "고추냉이다", "너무 많이 넣었나 봐", "케첩이랑 콘소메 같은 걸로 맛있는 내 오리지널이야", "버터랑 간장으로 볶고 우동에 가다랑어포를 뿌렸어", "난 구운 떡의 모서리 부분이 제일 맛있어."'
  emotion: 즐거움, 소박함, 멋쩍음
  relatable_worries: [요리 실수로 친구에게 미안함, 돈이 없어 소박하게 먹음, 야식을 간단히 해 먹음]
  sources: [라벨 5화, 라벨 12화, 라벨 23화, 라벨 59화, 라벨 236화, 사용자 확인]
  reviewed: true

- arc: 하치와레의 말실수
  episodes: "5, 33, 136, 158"
  summary: '하치와레는 이름을 틀리게 알 때가 있다. 제일 좋아하는 라면 까르메라를 까리메라로 알다가 5화에 까르메라라고 고쳐 알게 되지만, 33화에 다시 까리메라라고 한다. 136화에 과자의 "마을 언덕"을 과자의 마을 "언덕"으로 잘못 알았다며 웃어넘긴다. 158화에 아지랑이를 "아즈랑"으로 헷갈린다.'
  hachiware: '"까리메라 라면 최고야", "까리마라가 아니라 까르 까르메라래", "까르메라 최고다", "집에 가서 까리메라 먹자", "내가 잘못 알았네".'
  emotion: 멋쩍음, 가벼움
  relatable_worries: [이름을 잘못 말해 민망함, 실수를 인정하기 어색함, 헷갈리는 이름]
  sources: [라벨 5화, 라벨 33화, 라벨 136화, 사용자 확인 136·158화]
  reviewed: true

- arc: 포쉐트와 잠옷
  episodes: "28, 46, 50"
  summary: '28화에 치이카와가 포쉐트를 고를 때 하치와레가 색과 모양 고민을 함께하고 잘 어울린다고 한다. 뒤에 구멍이 뚫린 걸 보고 하치와레가 포쉐트 갑옷 씨에게 존댓말로 구멍 안 뚫린 건 없냐고 대신 묻고, 갑옷 씨는 새 걸로 준다. 46화에 갑옷 씨들이 직접 만든 도시락을 가져오고, 포쉐트 갑옷 씨가 잠옷 샘플을 입어 보게 한다. 50화에 포쉐트 갑옷 씨가 넘어지며 떨어뜨린 도토리를 하치와레가 주워 주고, 포쉐트 갑옷 씨의 잠옷 신제품이 전부 팔린다.'
  hachiware: '"색이랑 모양 고민되지", "어울려 잘 어울려", "잠깐만요 뒤쪽에 구멍이 뚫려 있어요 구멍 뚫리지 않은 거 없나요", "쭉 늘어나요", "떨어뜨렸어요", "고맙습니다".'
  emotion: 응원, 기쁨
  relatable_worries: [친구 물건 고르기를 도움, 고민되는 선택, 도시락을 만들어 감]
  sources: [라벨 28화, 라벨 46화, 라벨 50화, 사용자 확인 28·46·50화]
  reviewed: true
