  relatable_worries: [모르고 한 일로 갇힘, 위험을 뒤늦게 깨달음, 도와준 친구와 헤어짐]
  sources: [자막 190화, 자막 192화, 자막 195화, 나무위키 등장인물]
  reviewed: false

- arc: 코스 요리
  episodes: "200~201"
  summary: '하치와레가 친구들을 위해 코스 요리를 만들어 대접한다. 계속 만들기만 하는 이유를 묻자 요리 책의 한 구절로 답한다.'
  hachiware: '"오늘은 코스 요리를 준비했어요.", "손님이 즐겁고 맛있게 드시는게 저한텐 최고의 행복입니다. 그러니까 난 괜찮아. 그리고 만들면서 집어 먹었거든."'
  emotion: 뿌듯함, 배려
  relatable_worries: [남을 챙기느라 내 것은 못 먹음, 요리가 서툴러도 대접하고 싶음, 나눠 주는 즐거움]
  sources: [자막 200~201화, 나무위키 하치와레]
  reviewed: false

- arc: 슬롯 게임
  episodes: "202~211"
  summary: '게임센터의 슬롯 게임기로 하치와레와 우사기의 몸이 바뀐다. 돌아가지 않아도 괜찮다던 하치와레가 점점 돌아가고 싶어져, 그림을 맞추자 돌아온다. 모몽가가 기계를 부순다.'
  hachiware: '"서로 바뀐 거야. 몸이", 처음엔 "그렇다고 문제될 건 없어", "지금의 모습도 마음에 들어". 사진을 보고는 "돌아가고 싶어. 내 몸으로.", "찾아보자. 원래대로 돌아갈 방법."'
  emotion: 느긋함, 그리움, 의욕
  relatable_worries: [갑자기 내가 아닌 모습이 됨, 괜찮은 줄 알았는데 원래가 그리움, 친구와 입장이 바뀜]
  sources: [자막 202~211화, 나무위키 우사기]
  reviewed: false

- arc: 검은 별똥별 전편
  episodes: "213~221"
  summary: '하치와레가 검은 별똥별 이야기와 서서 먹는 국수 이야기를 하며 랭커를 동경한다. 이후 같은 날이 반복되는 듯한 날들이 이어지고 하치와레는 데자뷔라고 설명한다.'
  hachiware: '"나도 빨리 저렇게 랭커가 돼서 서서 국수 먹어보고 싶어.", "더 많이 강해지고 싶어.", "이런 날이 쭉 계속됐으면 좋겠다.", 반복 속에서 "오늘은 말이야 사진 찍으면서 놀까".'
  emotion: 동경, 평온, 의아함
  relatable_worries: [매일 같은 날이 반복되는 느낌, 지금이 계속되길 바람, 강해지고 싶은데 마음처럼 안 됨]
  sources: [자막 213~214화, 자막 218화, 자막 220화, 나무위키 등장인물]
