  summary: '하치와레 집에서 다 같이 자던 밤 몬스터에게 쫓긴다. 리본 덕에 몬스터 이빨이 부러져 위기를 넘기고, 리본이 두 개가 되어 어디에 묶을지 고민한다.'
  hachiware: '"이러다 전멸하겠어.", "어떻게든 어떻게든 어떻게든 되어라.", "이 리본이 우릴 구해줬어." 혼자 맞선 친구에게 "너 혼자서 물리치려고 했던 거야?"'
  emotion: 공포, 필사적, 안도, 걱정
  relatable_worries: [한밤에 위험한 일이 닥침, 친구가 혼자 위험을 떠안음, 소중한 물건이 도움이 됨]
  sources: [자막 184~186화, 나무위키 치이카와]
  reviewed: false

- arc: 오데와 함께 감옥
  episodes: "189~198"
  summary: '고블린이 소중히 여기는 버섯을 먹어 하치와레 일행이 감옥에 갇힌다. 오데와 함께 구멍을 파 탈출하고, 오데는 고블린의 경호원이 된다.'
  hachiware: '"고블린들이 소중히 여기는 버섯을 우리가 먹어서 붙잡힌 거야.", 시간이 지나 "이대로 있으면 잡아먹힐지도 몰라.", "얘들아, 여기에서 도망치자."'
