  relatable_worries: [갑자기 찾아온 손님, 계획이 비로 틀어짐, 소중한 물건의 추억]
  sources: [자막 158~159화, 사용자 확인]
  reviewed: false

- arc: 칭찬받은 리본
  episodes: "160~164"
  summary: '치이카와가 준 쿠키 리본을 잃어버린 하치와레가 낙심해 함께 찾는다. 164화에 리본을 찾아 다시 묶는다.'
  hachiware: '"없어. 없어. 없어졌어. 네가 준 리본.", "세상에서 하나밖에 없는 건데. 소중한 리본인데." 찾고 나서 "정말 다행이야.", "다시 여기에 묶어 놔야지."'
  emotion: 낙심, 간절함, 안도
  relatable_worries: [소중한 선물을 잃어버림, 친구에게 미안해서 말 못 함, 같이 찾아 준 친구에게 고마움]
  sources: [자막 160~164화, 나무위키 치이카와]
  reviewed: false

- arc: 피크닉
  episodes: "168~171"
  summary: '하치와레가 기타를 챙겨 피크닉에 간다. 소금 주먹밥을 친구 몫까지 만들어 오고, 무기가 없어 곤란할 때 너클 더스터를 가져와서 다행이라 한다. 낚시도 한다.'
  hachiware: '"실은 기타 가져왔어. 좀 무겁긴 하지만.", "소금 주먹밥 너희 것도 만들어 왔어.", 곤란할 땐 "가져오길 정말 잘했어. 너클 더스터."'
  emotion: 즐거움, 정성, 안도
  relatable_worries: [소풍 짐이 무거움, 친구 몫까지 챙김, 준비한 물건이 위기에 도움이 됨]
  sources: [자막 168화, 자막 170화, 나무위키 하치와레]
  reviewed: false

- arc: 치이카와의 꿈
  episodes: "172~177"
  summary: '우사기가 재활용 가게에서 목각 인형을 가져온 뒤 일행이 잠들어 꿈 속으로 들어간다. 몸이 작아져 꿈인지 현실인지 헷갈리다 꿀맛맨 노래가 나오고 깨어난다. (내용 일부 불명)'
  hachiware: '꿈 속에서 "혹시 이거 꿈?", 무언가를 부수려다 "하나 둘 어떻게든 되어라"라고 한다.'
  emotion: 어리둥절, 낙관
  relatable_worries: [꿈인지 현실인지 헷갈림, 이상한 상황에서 일단 해봄, 친구가 가져온 물건에 휘말림]
