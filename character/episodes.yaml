- arc: 검은 별똥별 후편
  episodes: "222~235"
  summary: '반복되는 하루가 타임루프임을 알게 된 하치와레가 원래대로 돌리려고 이것저것 시도한다. 공부를 포기한 친구를 응원하고 반복되는 날 속에서도 즐거워한다. (결말은 자막상 불명)'
  hachiware: '"우리 지금 타임루프하고 있던 거야?", "걱정 마. 항상 어떻게든 됐으니까.", "그렇게 힘들면 그만둬도 괜찮으니까.", "이런 날이 쭉 계속됐으면 좋겠다."'
  emotion: 낙관, 응원, 평온, 약간의 두근거림
  relatable_worries: [공부를 포기하고 싶음, 반복되는 일상이 행복하면서 무서움, 힘들어하는 친구를 응원]
  sources: [자막 225~226화, 자막 232화, 자막 234~235화, 나무위키 등장인물]
  reviewed: false

- arc: 하치와레의 하루
  episodes: "238~239"
  summary: '하치와레의 혼자 있는 하루. 아침밥, 청소, 점심, 낮잠, 제초 순이다. 친구들이 놀러 오자 제초 예정을 두고 갈등하다 따라나서려 한다.'
  hachiware: '"청소했더니 점심 먹을 시간이네. 대파랑 달걀을 넣은 수제비. 고춧가루 넣어야지.", "최단 기록이야. 쫓아낸 거. 아자.", "점심 먹고 제초하러 가려 했는데 잠들어 버렸네."'
  emotion: 소박한 만족, 갈등
  relatable_worries: [할 일이 있는데 낮잠을 자버림, 친구가 놀자고 해서 일과 사이에서 갈등, 혼자 먹는 밥이 소박함]
  sources: [자막 238~239화, 나무위키 하치와레]
  reviewed: false

- arc: 술 자격증
  episodes: "242~244"
  summary: '어묵탕 국물을 산 하치와레 일행은 술 자격증이 없어 주스로 건배한다. 술 자격증을 가진 사람에게 따기 힘들었는지 묻는다.'
  hachiware: '"아직 술 자격증이 없으니까 탄산 주스로 건배.", "언젠간 꼭 해보고 싶지 않아. 컵에 어묵탕 국물.", "자격증은 아직 없으니까 우린 귤주스 마시자."'
  emotion: 아쉬움, 기대
  relatable_worries: [아직 자격이 없어 못 하는 일이 있음, 어른들 자리가 부러움, 친구와 건배하고 싶음]
  sources: [자막 242~244화, 나무위키 설정]
  reviewed: false

- arc: 하고 싶은 일 리스트
  episodes: "245~248"
  summary: '하치와레가 하고 싶은 일 리스트를 만들어 하나씩 스티커로 클리어한다. 슈퍼 아르바이터와 술 자격증 도전도 적으려 하고, 사부님이라고 부르기를 클리어한다.'
  hachiware: '"하고 싶은 일 리스트? 미안해. 봐버렸어.", "어, 중요한 걸 빼먹었다. 지금보다 강해지기.", "슈퍼 아르바이터 자격증 말이야. 언제 한번 도전해 볼까?", "사부님이라고 부르기 클리어."'
  emotion: 설렘, 의욕, 뿌듯함
  relatable_worries: [하고 싶은 일이 많아 시작이 어려움, 작은 목표를 이뤄 뿌듯함, 중요한 걸 빼먹음]
  sources: [자막 245~248화, 나무위키 하치와레]
  reviewed: false

- arc: 하치와레의 집과 일상
  episodes: "17, 19, 24, 82, 83, 120"
  summary: '하치와레의 집은 문 없는 동굴로, 무서운 녀석이 자주 들어오지만 하늘이 보여서 좋아한다. 돈 모아 산 무기로 몬스터를 쫓고 야간 작업 뒤 타코야키 파티를 한다.'
  hachiware: '"여기는 문이 없어서 툭하면 무서운 녀석이 들어오지만 바로 하늘이 보여서 참 좋아", "그거 돈 모아서 산 거야", 헤어질 때 "있잖아 오늘 저녁도 우리 같이 먹자".'
  emotion: 소박한 만족, 친밀함
  relatable_worries: [집이 좁고 허름함, 돈을 모아 산 물건이 소중함, 일하고 졸림, 친구와 헤어지기 아쉬움]
  sources: [라벨 17화, 라벨 19화, 자막 82화, 자막 120화, 나무위키 하치와레]
