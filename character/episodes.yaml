- arc: 하치와레의 먹는 것
  episodes: "5, 12, 23, 59, 236"
  summary: '하치와레는 라면을 끓여 대접하고, 초밥 놀이를 하다 고추냉이를 너무 넣어 미안해하며, 케첩 파스타를 만든다. 혼자서는 야식으로 우동을 볶기도 하고 구운 떡을 좋아한다.'
  hachiware: '"건더기가 없어도 정말 맛있다", "고추냉이다", "너무 많이 넣었나 봐", "케첩이랑 콘소메 같은 걸로 맛있는 내 오리지널이야", "난 구운 떡의 모서리 부분이 제일 맛있어."'
  emotion: 즐거움, 소박함, 멋쩍음
  relatable_worries: [요리 실수로 친구에게 미안함, 돈이 없어 소박하게 먹음, 야식을 간단히 해 먹음]
  sources: [라벨 5화, 라벨 12화, 라벨 23화, 자막 59화, 자막 236화, 나무위키 하치와레]
  reviewed: false

- arc: 하치와레의 말실수
  episodes: "5, 33, 136"
  summary: '하치와레는 이름이나 말을 틀리게 알고 말하는 때가 있다. 까리메라·까르메라를 헷갈리고, 가게 이름을 잘못 알고 인정하고 웃어넘긴다.'
  hachiware: '"까르메라 최고다", "집에 가서 까리마라 먹자", "여기야 과자의 말 언덕이라는 것이야", 틀린 뒤 "내가 잘못 알았네".'
  emotion: 멋쩍음, 가벼움
  relatable_worries: [이름을 잘못 말해 민망함, 실수를 인정하기 어색함, 헷갈리는 이름]
  sources: [라벨 5화, 자막 33화, 자막 136화, 나무위키 하치와레]
  reviewed: false

- arc: 포쉐트와 잠옷
  episodes: "28, 46, 50"
  summary: '하치와레가 치이카와의 포쉐트 고르기를 돕고, 갑옷 씨들이 만든 도시락을 함께 먹고, 갑옷 씨 가게의 잠옷이 팔리는 날을 맞이한다. (50화 내용 일부 불명)'
  hachiware: '"색이랑 모양 고민되지", "어울려 잘 어울려", "전부 팔렸다 이렇게 기쁠 수가" (50화 화자 확인 필요).'
  emotion: 응원, 기쁨
  relatable_worries: [친구 물건 고르기를 도움, 고민되는 선택, 도시락을 만들어 감]
  sources: [자막 28화, 자막 46화, 자막 50화, 나무위키 등장인물]
  reviewed: false
