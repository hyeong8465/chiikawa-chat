<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골든셋 채점</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;max-width:860px;margin:0 auto;padding:16px;background:#fafafa;color:#222}
#top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:#555}
#nav{display:flex;gap:8px;margin:8px 0}
.meta{color:#777;font-size:14px;margin:8px 0}
.conv{white-space:pre-wrap;color:#555;font-size:16px;padding:10px;background:#f0f0f0;border-radius:6px}
#resp{font-size:22px;line-height:1.6;margin:14px 0;padding:14px;background:#fff;border:1px solid #ddd;border-radius:8px;word-break:keep-all;white-space:pre-wrap}
.item{padding:10px;margin:8px 0;background:#fff;border:2px solid #ddd;border-radius:8px}
.item.focus{border-color:#e0a800}
.item h3{margin:0 0 4px;font-size:16px}
.def{color:#666;font-size:14px;margin-bottom:8px}
button{min-height:44px;padding:0 16px;font-size:16px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
button.on1{background:#d8f0d8;border-color:#3a3}
button.on0{background:#fbdcdc;border-color:#c33}
.err{color:#c00}
</style>
</head>
<body>
<div id="top"><span id="prog"></span><span id="status"></span></div>
<div id="nav"><button id="prev">◀ 이전</button><button id="next">다음 ▶</button><button id="first">안 한 곳으로</button></div>
<div class="meta" id="meta"></div>
<div class="conv" id="conv"></div>
<div id="resp"></div>
<div id="items"></div>
<p style="color:#888;font-size:13px">1 통과 · 0 실패 · ↑/↓ 항목 이동 · ←/→ 응답 이동 · 누를 때마다 저장</p>
<script>
const $ = id => document.getElementById(id);
let R = [], marks = {}, defs = {}, idx = 0, focus = 0;
const key = (id, item) => id + "|" + item;

async function load(){
  const d = await (await fetch("/api/data")).json();
  R = d.responses; defs = d.defs;
  for (const l of d.labels) marks[key(l.id, l.item)] = l.pass;
  idx = Math.max(0, R.findIndex(r => r.items.some(i => !marks[key(r.id, i)])));
  render();
}
function done(r){ return r.items.every(i => marks[key(r.id, i)]); }
function render(){
  const r = R[idx];
  const filled = Object.values(marks).filter(v => v).length;
  $("prog").textContent = `${idx + 1} / ${R.length} · 채운 칸 ${filled} / ${Object.keys(marks).length}`;
  $("meta").textContent = `${r.id} · ${r.category} · 의도: ${r.note || ""}`;
  $("conv").textContent = r.conversation || "";
  $("resp").textContent = r.response;
  $("items").innerHTML = "";
  r.items.forEach((it, n) => {
    const v = marks[key(r.id, it)];
    const div = document.createElement("div");
    div.className = "item" + (n === focus ? " focus" : "");
    div.innerHTML = `<h3></h3><div class="def"></div>`;
    div.querySelector("h3").textContent = it;
    div.querySelector(".def").textContent = defs[it] || "";
    for (const [val, label] of [["1", "통과"], ["0", "실패"]]) {
      const b = document.createElement("button");
      b.textContent = label;
      if (v === val) b.className = "on" + val;
      b.onclick = () => { focus = n; mark(val); };
      div.appendChild(b);
      div.appendChild(document.createTextNode(" "));
    }
    $("items").appendChild(div);
  });
}
async function mark(val){
  const r = R[idx], k = key(r.id, r.items[focus]);
  const old = marks[k];
  marks[k] = marks[k] === val ? "" : val;   // 같은 걸 다시 누르면 지움
  render();
  try {
    const res = await fetch("/api/labels", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({[k]: marks[k]})});
    if (!res.ok) throw new Error(res.status);
    $("status").textContent = "저장됨"; $("status").className = "";
  } catch (e) {
    marks[k] = old; render();
    $("status").textContent = "저장 실패: " + e.message; $("status").className = "err";
    return;
  }
  if (marks[k] && focus < r.items.length - 1) { focus++; render(); }
}
function go(n){ idx = Math.min(R.length - 1, Math.max(0, n)); focus = 0; render(); }
$("prev").onclick = () => go(idx - 1);
$("next").onclick = () => go(idx + 1);
$("first").onclick = () => { const n = R.findIndex(r => !done(r)); if (n >= 0) go(n); };
document.addEventListener("keydown", e => {
  if (e.key === "1" || e.key === "0") mark(e.key);
  else if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === "ArrowDown") { focus = Math.min(R[idx].items.length - 1, focus + 1); render(); }
  else if (e.key === "ArrowUp") { focus = Math.max(0, focus - 1); render(); }
});
load();
</script>
</body>
</html>
