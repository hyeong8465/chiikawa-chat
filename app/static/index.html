<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하치와레랑 얘기하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Poor+Story&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone">
  <header>
    <img class="face" id="top-face" src="/static/face/base.webp" alt="">
    <div><h1>하치와레</h1><small>치이카와(먼작귀)</small></div>
    <button id="mode" type="button">말투 변환</button>
  </header>
  <main id="chat">
    <div class="stage">
      <div class="log" id="scroller"><div id="log" aria-live="polite"></div></div>
      <div class="reply"><small>이렇게 답해 볼까?</small><div class="chips" id="chips"></div></div>
    </div>
    <form id="form">
      <label class="sr" for="input">메시지</label>
      <input id="input" maxlength="1000" placeholder="하치와레에게 말 걸기" autocomplete="off">
      <button id="send" aria-label="보내기">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2A2522" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
  </main>
  <main id="tone" hidden>
    <div class="tone-body">
      <p class="tone-help">하고 싶은 말을 적으면 하치와레 말투로 바꿔 줘요.</p>
      <form id="tone-form" class="tone-form">
        <label class="sr" for="tone-input">바꿀 문장</label>
        <textarea id="tone-input" maxlength="200" rows="3" placeholder="예: 늦지 말고 7시까지 나와"></textarea>
        <div class="tone-bar"><span id="tone-count">0/200</span><button id="tone-go">바꾸기</button></div>
      </form>
      <div id="tone-out" aria-live="polite"></div>
    </div>
  </main>
  <p class="notice">비공식 팬메이드, 비영리예요. 답은 AI가 해요. 권리자가 요청하면 바로 내려요.</p>
</div>

<dialog id="notice-dialog">
  <p>AI가 만든 응답이며, 대화는 품질 개선을 위해 익명으로 기록돼요.</p>
  <button id="notice-ok">알겠어요</button>
</dialog>

<template id="thumb-up">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.5 1 2 3l-.5 3H19a1.5 1.5 0 0 1 1.5 1.8l-1.3 6A2 2 0 0 1 17.2 20H7"/></svg>
</template>
<template id="thumb-down">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 13V4H4v9zM7 13l4 7c1.5 0 2.5-1 2-3l-.5-3H19a1.5 1.5 0 0 0 1.5-1.8l-1.3-6A2 2 0 0 0 17.2 4H7"/></svg>
</template>
<script src="/static/app.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
