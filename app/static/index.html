<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하치와레랑 얘기하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone">
  <header>
    <h1>하치와레랑 얘기하기</h1>
    <small>치이카와(먼작귀)</small>
  </header>
  <div class="tabs" role="tablist">
    <button id="tab-chat" role="tab" aria-selected="true" aria-controls="chat">대화</button>
    <button id="tab-tone" role="tab" aria-selected="false" aria-controls="tone">말투 변환</button>
  </div>
  <main id="chat" role="tabpanel" aria-labelledby="tab-chat">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <label class="sr" for="input">메시지</label>
      <input id="input" class="wobble2" maxlength="1000" placeholder="하치와레에게 말 걸기" autocomplete="off">
      <button id="send" class="wobble" aria-label="보내기">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </main>
  <main id="tone" role="tabpanel" aria-labelledby="tab-tone" hidden>
    <p class="soon">준비 중이에요</p>
  </main>
  <p class="notice">비공식 팬메이드 · AI 응답 · 비영리 · 권리자 요청 시 즉시 내립니다</p>
</div>

<dialog id="notice-dialog" class="wobble">
  <p>AI가 만든 응답이며, 대화는 품질 개선을 위해 익명으로 기록돼요.</p>
  <button id="notice-ok" class="wobble">알겠어요</button>
</dialog>

<template id="head-svg">
  <svg class="head" viewBox="0 0 32 20" width="32" height="20" aria-hidden="true"><path d="M2 18A14 14 0 0 1 30 18Z" fill="#9EC9F0" stroke="#2B2B2B" stroke-width="2" stroke-linejoin="round"/><path d="M16 5L12 18H20Z" fill="#fff"/></svg>
</template>
<template id="thumb-up">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.5 1 2 3l-.5 3H19a1.5 1.5 0 0 1 1.5 1.8l-1.3 6A2 2 0 0 1 17.2 20H7"/></svg>
</template>
<template id="thumb-down">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 13V4H4v9zM7 13l4 7c1.5 0 2.5-1 2-3l-.5-3H19a1.5 1.5 0 0 0 1.5-1.8l-1.3-6A2 2 0 0 0 17.2 4H7"/></svg>
</template>
<script src="/static/app.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
